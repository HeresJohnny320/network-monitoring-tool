# Builds every platform and publishes it.
#
# * Push to main    -> tests, builds all platforms, and publishes the next release
#                      (v1.8 -> v1.9 -> v1.10 ...) plus a Docker image. The install
#                      scripts always download the newest release.
#                      Put "[skip release]" in the commit message to only build.
# * Push a tag v*   -> publishes that exact version (e.g. git tag v2.0 && git push origin v2.0)
# * Pull request    -> tests and builds only
# * Actions tab     -> "Run workflow" to publish by hand, optionally as a new major version
# Docs-only changes (README, docs/) don't trigger anything.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [next, major]
        default: next

permissions:
  contents: read

# Never let two releases run at once (they'd pick the same version number).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ inputs.bump || 'next' }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Newest vX.Y or vX.Y.Z tag; bump its last number (or the major one).
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          latest=${latest:-v1.0}
          IFS=. read -r major rest <<<"${latest#v}"
          if [ "$BUMP" = major ]; then
            next="v$((major + 1)).0"
          else
            last=${latest##*.}
            next="${latest%.*}.$((last + 1))"
          fi

          release=false
          if [ "$EVENT" = workflow_dispatch ] || { [ "$EVENT" = push ] && [ "$REF_NAME" = main ] && [[ "$COMMIT_MSG" != *"[skip release]"* ]]; }; then
            release=true
          else
            next="$next-dev.$(git rev-parse --short HEAD)"
          fi
          echo "Latest release $latest -> building $next (publish: $release)"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet & test
        run: |
          go vet ./...
          go test ./...

      - name: Build all platforms
        run: ./build.sh
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: network_monitor_tool-${{ needs.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: network_monitor_tool-${{ needs.version.outputs.version }}
          path: dist

      # Creates the tag on this commit if it doesn't exist yet.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          make_latest: true

  docker:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }} # lowercased automatically
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.version.outputs.version }}
